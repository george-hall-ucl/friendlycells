[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "friendlycells"
version = "1.0.0"
description = "Alignment-free similarity measures for spatial transcriptomics."
readme = "README.md"
authors = [
    { name = "George Hall", email = "george.hall@ucl.ac.uk" },
    { name = "Sergi Castellano", email = "s.castellano@ucl.ac.uk" },
    { name = "Anna Drhovska", email = "annadrhovska@gmail.com" },
]
maintainers = [{ name = "George Hall", email = "george.hall@ucl.ac.uk" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/george-hall-ucl/friendlycells"
Issues = "https://github.com/george-hall-ucl/friendlycells/issues"

[tool.setuptools]
packages = ["friendlycells"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pylint.main]
extension-pkg-allow-list = ["scipy"]
generated-members = ["simplices"]
max-args = 11
max-positional-arguments = 11
max-locals = 16
